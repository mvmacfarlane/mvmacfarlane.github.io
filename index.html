<script>
// Load homepage-specific content
async function loadHomepageContent() {
    try {
        // Load news content (homepage version)
        const newsResponse = await fetch('/content/news_homepage.md');
        const newsText = await newsResponse.text();
        document.getElementById('news-content').innerHTML = markdownToHtml(newsText);
    } catch (error) {
        console.error('Error loading homepage content:', error);
    }
}

// Load content when page loads
document.addEventListener('DOMContentLoaded', async () => {
    await loadContent();
    await loadHomepageContent();
});
</script>
